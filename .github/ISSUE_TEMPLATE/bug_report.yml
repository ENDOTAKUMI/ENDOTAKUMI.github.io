name: バグ報告
description: バグや問題を報告する
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。以下の項目を記入してください。

  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: バグの内容を詳しく説明してください
      placeholder: どのような問題が発生していますか？
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: バグを再現するための手順を教えてください
      placeholder: |
        1. '...'に移動
        2. '...'をクリック
        3. '...'まで下にスクロール
        4. エラーが表示される
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 本来どのような動作を期待していましたか？
      placeholder: 何が起こるべきでしたか？
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: スクリーンショット
      description: 可能であれば、問題を示すスクリーンショットを添付してください
      placeholder: スクリーンショットをドラッグ＆ドロップ

  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 使用している環境について教えてください
      placeholder: |
        - OS: [例: macOS 14.0]
        - ブラウザ: [例: Chrome 120]
        - Node.js: [例: v20.11.0]
        - pnpm: [例: 10.18.3]
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: その他、参考になる情報があれば記入してください
      placeholder: エラーメッセージ、ログなど
