name: 機能リクエスト
description: 新しい機能や改善を提案する
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能リクエストありがとうございます。以下の項目を記入してください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: この機能リクエストに関連する問題は何ですか？
      placeholder: "〜のとき、〜ができなくて困っている"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: どのような機能や改善を提案しますか？
      placeholder: "〜という機能があれば、〜できるようになる"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に検討した解決策はありますか？
      placeholder: "〜という方法も考えたが、〜という理由で適していない"

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: その他、参考になる情報があれば記入してください
      placeholder: 参考リンク、モックアップ、使用例など
